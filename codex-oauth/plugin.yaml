name: codex-oauth
version: 1.2.1
description: "Conecta o Hermes às assinaturas ChatGPT/Codex (device code) e Claude Pro/Max (PKCE) via OAuth direto pelo chat do dashboard, por qualquer plataforma de mensagem ou pela CLI. Expõe ferramentas para o agente guiar o usuário, os comandos /codex-login, /codex-status e /codex-model, e o subcomando `hermes codex-oauth`."
author: "AstraOnlineWeb"
kind: standalone
license: MIT
homepage: https://github.com/AstraOnlineWeb/hermes-plugins
tags:
  - oauth
  - codex
  - openai
  - chatgpt
  - auth
provides_tools:
  - codex_oauth_status
  - codex_oauth_start
  - codex_oauth_check
  - codex_oauth_set_model
  - codex_oauth_cancel
  - claude_oauth_status
  - claude_oauth_start
  - claude_oauth_submit
  - claude_oauth_set_model
provides_hooks: []
python_dependencies: []
config_schema:
  default_model:
    type: string
    description: "Modelo definido como padrão após o login (quando set_model=true). Padrão: gpt-5.5"
    default: "gpt-5.5"
  auto_set_model:
    type: boolean
    description: "Ao concluir o login, ajusta model.provider=openai-codex e model.default automaticamente."
    default: true
